services:
  sunset-leads:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunset-leads-app
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - GROQ_CLOUD_API_KEY=${GROQ_CLOUD_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-oss-120b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - RATE_LIMIT_DELAY_SECONDS=1.0
      - PLAYWRIGHT_TIMEOUT_MS=20000
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/sunset_leads.db
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

